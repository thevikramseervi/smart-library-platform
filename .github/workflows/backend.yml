name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smart_library
          POSTGRES_PASSWORD: smart_library
          POSTGRES_DB: smart_library_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U smart_library -d smart_library_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smart_library:smart_library@localhost:5433/smart_library_test
      TEST_DATABASE_URL: postgresql+psycopg://smart_library:smart_library@localhost:5433/smart_library_test
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -q
